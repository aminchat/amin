<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="برنامه مدیریت سرمایه و خرج به روش چهار پاکت">
<title>مدیریت سرمایه</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=vazirmatn:400,600,700&display=swap">
<link rel="stylesheet" href="css/app.css?v=2.18.2">
<script>
window.__capErrors = [];
window.__capLog = function (where, err) {
  var msg = (err && (err.stack || err.message)) || String(err);
  var row = { where: String(where || ''), msg: msg, at: Date.now() };
  window.__capErrors.push(row);
  try {
    localStorage.setItem('capital_debug_errors', JSON.stringify(window.__capErrors.slice(-30)));
  } catch (e) {}
};
window.addEventListener('error', function (e) {
  window.__capLog((e.filename || '') + ':' + (e.lineno || ''), e.error || e.message);
});
window.addEventListener('unhandledrejection', function (e) {
  window.__capLog('promise', e.reason);
});
try {
  if (localStorage.getItem('capital_pin_hash') || localStorage.getItem('capital_secure_v2'))
    document.documentElement.classList.add('needs-lock');
} catch (e) {}
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
/* Legal links: quiet footer, inherits app font/theme tokens */
.public-links{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 0;font-size:var(--fs-xs);line-height:1.6;color:var(--muted);letter-spacing:.01em}
.public-links a{color:var(--muted);text-decoration:none;padding:4px 6px;border-radius:6px;transition:color .15s}
.public-links a:hover,.public-links a:focus-visible{color:var(--accent);outline:none}
.public-links a+a::before{content:"·";color:var(--faint);margin-inline-end:6px}
#appPublicInfo{margin:var(--sp-6) 0 calc(96px + env(safe-area-inset-bottom,0px));text-align:center}
#appPublicInfo .public-support{margin:2px 0 0;font-size:var(--fs-xs);color:var(--faint)}
#appPublicInfo .public-support a{color:inherit;text-decoration:none}
#lockScreen .public-links{margin-top:var(--sp-5)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo"></div>
    <div>
      <b id="pageTitle">خانه</b>
      <small id="todayLbl">—</small>
    </div>
  </div>
  <div class="hdr-actions">
    <button type="button" class="hdr-btn av-btn" id="btnProfile" title="حساب کاربری" aria-label="حساب کاربری"></button>
    <button type="button" class="hdr-btn" id="btnPrivacy" title="مخفی کردن اعداد" aria-label="مخفی کردن اعداد"></button>
    <button type="button" class="hdr-btn" id="btnSettings" title="تنظیمات" aria-label="تنظیمات"></button>
  </div>
</header>

<main>
  <section id="tab-home" class="active">
    <div id="homeContent"></div>
  </section>
  <section id="tab-tx">
    <div id="txContent"></div>
  </section>
  <section id="tab-report">
    <div id="reportContent"></div>
  </section>
  <section id="tab-assets">
    <div id="assetsOverview"></div>
    <div id="assetsView" style="display:none">
      <div class="viewbar" id="assetsViewBar"></div>
      <div id="accountsContent" style="display:none"></div>
      <div id="investContent" style="display:none"></div>
      <div id="debtsContent" style="display:none"></div>
      <div id="installmentsContent" style="display:none"></div>
    </div>
  </section>

  <!-- Keep outside homeContent: the dashboard replaces that element dynamically. -->
  <footer id="appPublicInfo">
    <div class="public-links" aria-label="اطلاعات حقوقی برنامه">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </div>
    <p class="public-support"><a href="mailto:amin20051@gmail.com" dir="ltr">amin20051@gmail.com</a></p>
  </footer>
</main>

<nav id="bottomNav" aria-label="ناوبری">
  <button type="button" class="bn" data-tab="home" data-ic="home"><span class="bnl">خانه</span></button>
  <button type="button" class="bn" data-tab="tx" data-ic="list"><span class="bnl">تراکنش‌ها</span></button>
  <button id="fab" title="تراکنش جدید" aria-label="افزودن"></button>
  <button type="button" class="bn" data-tab="report" data-ic="chart"><span class="bnl">گزارش</span></button>
  <button type="button" class="bn" data-tab="assets" data-ic="wallet"><span class="bnl">ثروت</span></button>
</nav>


<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div id="lockScreen">
  <div class="lock-box">
    <div class="logo" style="margin:0 auto 14px"></div>
    <h1 id="lockTitle">ورود</h1>
    <p id="lockSub">رمز ورود</p>
    <input class="input" id="lockPin" type="password" maxlength="64" placeholder="رمز" autocomplete="current-password" name="app-pass" style="text-align:center;margin-bottom:12px">
    <button class="btn primary block" onclick="submitLockPin()">ورود</button>
    <button class="btn block" id="lockBio" style="margin-top:8px;display:none" onclick="bioUnlock()">ورود با اثر انگشت</button>
    <button class="link-btn" id="lockSwitch" style="display:none">ورود با رمز عبورِ مشترک</button>
    <button class="link-btn" id="lockForgot" style="display:none">رمز عبور را فراموش کردم</button>
    <div id="lockDebug" class="small muted" style="margin-top:10px;color:#fb7185"></div>
    <div class="public-links" aria-label="حریم خصوصی و شرایط استفاده">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </div>
  </div>
</div>

<script type="module" src="js/boot.js?v=2.18.2"></script>
</body>
</html>
